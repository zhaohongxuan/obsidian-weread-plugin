name: Release Obsidian plugin

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

env:
  PLUGIN_NAME: obsidian-weread-plugin

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        id: build
        run: |
          npm install
          npm run build
          mkdir "${PLUGIN_NAME}"
          cp ./dist/main.js ./dist/manifest.json ./dist/style.css "${PLUGIN_NAME}"
          zip -r "${PLUGIN_NAME}.zip" "${PLUGIN_NAME}"
          echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ${{ env.PLUGIN_NAME }}-${{ github.ref_name }}.zip
            ./dist/main.js
            ./dist/manifest.json
            ./dist/style.css
